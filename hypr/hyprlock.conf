$color = rgba(18, 18, 18, 1)
$inner_color = rgba(18, 18, 18, 0.72)
$outer_color = rgb(200, 200, 200)
$font_color = rgb(255, 255, 255)
$placeholder_color = rgba(210, 210, 210, 0.7)
$check_color = rgba(145, 145, 145, 1)

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = $color
    path = ~/.config/hypr/background.png
}

animations {
    enabled = true
}

input-field {
    monitor =
    size = 650, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 2

    font_family = JetBrainsMono Nerd Font
    font_color = $font_color

    placeholder_text = Enter Password
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 10
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = false
}